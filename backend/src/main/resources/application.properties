spring.application.name=bsicrm
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=${DB_URL:jdbc:postgresql://172.31.65.35:5432/bsicrm}
spring.datasource.username=${DB_USERNAME:bt}
spring.datasource.password=${DB_PASSWORD:bt}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.jackson.time-zone=UTC
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.jwt-secret=${JWT_SECRET:sgffhgfshdgfsgfyweigrtg784384798tghwsdgfsd@@@jkhfdjsdhfjksdfjksdfjsfjjrce}
app.admin-password=${ADMIN_PASSWORD:Aa1234567890@@}
app.cookie-secure=${COOKIE_SECURE:false}
app.cors-origins=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://172.31.13.30:[*],http://172.31.13.34:[*],https://localhost:[*],https://172.31.13.30:[*]}
app.demo-data=${DEMO_DATA:false}
app.public-url=${PUBLIC_URL:http://172.31.13.30:3000}
app.sms-url=${SMS_URL:}
app.sms-token=${SMS_TOKEN:}
app.sms-enabled=${SMS_ENABLED:false}
logging.level.org.springframework.security=INFO

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.automation-enabled=${AUTOMATION_ENABLED:false}
app.sms-callback-secret=${SMS_CALLBACK_SECRET:}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.paths-to-match=/api/**

app.payment-merchant=${PAYMENT_MERCHANT:}
app.payment-sandbox=${PAYMENT_SANDBOX:false}

# Redis is opt-in. No Redis bean or connection is created when false.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.redis-enabled=${REDIS_ENABLED:false}
app.rate-limit.redis-uri=${REDIS_URI:redis://localhost:6379/0}
app.rate-limit.read-capacity=${RATE_LIMIT_READ_CAPACITY:600}
app.rate-limit.write-capacity=${RATE_LIMIT_WRITE_CAPACITY:120}
app.rate-limit.auth-capacity=${RATE_LIMIT_AUTH_CAPACITY:40}
app.rate-limit.captcha-capacity=${RATE_LIMIT_CAPTCHA_CAPACITY:100}
app.rate-limit.session-capacity=${RATE_LIMIT_SESSION_CAPACITY:120}
app.rate-limit.public-capacity=${RATE_LIMIT_PUBLIC_CAPACITY:300}
spring.web.locale=fa
spring.web.locale-resolver=fixed
